name: Promote dev to main

on:
  workflow_dispatch:
    inputs:
      title:
        description: Squash commit title
        required: true
        default: Promote dev

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: dev

      - name: Promote and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          if git diff --quiet origin/main HEAD; then
            echo "No changes between dev and main, nothing to promote."
            exit 0
          fi

          # Compute next CalVer: YYYY.MM.PATCH (PATCH increments within the month)
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          PATCH=0
          EXISTING=$(git tag -l "v${YEAR}.${MONTH}.*" | sed "s/v${YEAR}.${MONTH}.//" | sort -n | tail -1)
          if [[ -n "$EXISTING" ]]; then
            PATCH=$(( EXISTING + 1 ))
          fi
          VERSION="${YEAR}.${MONTH}.${PATCH}"
          TAG="v${VERSION}"
          echo "Will release as: $TAG"

          # Bump package.json on dev so the version bump rides along through the PR.
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          if ! git diff --quiet package.json; then
            git add package.json
            git commit -m "chore(release): prepare ${TAG}"
            git push origin dev
          fi

          # Create PR dev → main and squash-merge it. Branch protection requires PR;
          # bot can self-merge since required_approving_review_count is 0.
          pr_url=$(gh pr create --base main --head dev \
            --title "$TITLE" \
            --body "Automated promotion. Will release as ${TAG}.")
          pr_number=$(basename "$pr_url")
          gh pr merge "$pr_number" --squash --delete-branch=false

          # Reset dev to match the new main so dev never trails behind.
          git fetch origin main
          git push --force-with-lease origin origin/main:refs/heads/dev

          # Tag the new HEAD of main (the squash commit) and create the GitHub release.
          git tag -a "$TAG" origin/main -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --generate-notes --title "v${VERSION}"

name: Promote dev to main

on:
  workflow_dispatch:
    inputs:
      title:
        description: Squash commit title
        required: true
        default: Promote dev

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Squash-merge dev into main and reset dev
        env:
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev

          if git diff --quiet origin/main origin/dev; then
            echo "No changes between dev and main, nothing to promote."
            exit 0
          fi

          git merge --squash origin/dev
          git commit -m "$TITLE"
          git push origin main

          # Reset dev to match the new main so dev never trails behind.
          git push --force-with-lease origin main:dev
